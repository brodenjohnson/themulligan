<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mulligan — Sign in</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
  .login-wrap { width: 400px; max-width: 90vw; }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo .logo-text { font-size: 28px; }
  .login-dashes { display: flex; justify-content: center; gap: 4px; margin-top: 6px; }
  .login-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 28px; }
  .login-title { font-size: 18px; font-weight: 600; color: var(--black); margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: var(--ink3); margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink2); margin-bottom: 5px; }
  .field input { width: 100%; }
  .login-btn { width: 100%; padding: 10px; font-size: 14px; margin-top: 4px; justify-content: center; }
  .login-switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--ink3); }
  .login-switch a { color: var(--teal); text-decoration: none; font-weight: 500; cursor: pointer; }
  .error-msg { background: rgba(255,59,107,0.08); border: 0.5px solid rgba(255,59,107,0.3); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; color: #cc1a3e; margin-bottom: 14px; display: none; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
  .divider-line { flex: 1; height: 0.5px; background: var(--border); }
  .divider-text { font-size: 12px; color: var(--ink4); }
  .google-btn { width: 100%; padding: 10px; font-size: 13px; justify-content: center; margin-bottom: 4px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--card); color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.15s; }
  .google-btn:hover { background: var(--bg); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-text"><span class="the" style="color:var(--teal);">the</span> Mulligan</div>
    <div class="login-dashes">
      <div class="ld ld1"></div>
      <div class="ld ld2"></div>
      <div class="ld ld3"></div>
    </div>
  </div>
  <div class="login-card">
    <div class="login-title" id="formTitle">Sign in</div>
    <div class="login-sub" id="formSub">Your Commander deck advisor.</div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary login-btn" id="submitBtn" onclick="handleSubmit()">
      <span id="submitText">Sign in</span>
    </button>
    <div class="divider"><div class="divider-line"></div><div class="divider-text">or</div><div class="divider-line"></div></div>
    <button class="google-btn" onclick="handleGoogle()">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <div class="login-switch" id="switchText">
      Don't have an account? <a onclick="toggleMode()">Sign up</a>
    </div>
  </div>
</div>
<script src="/shared.js"></script>
<script>
let isSignUp = false;

function toggleMode() {
  isSignUp = !isSignUp;
  document.getElementById('formTitle').textContent = isSignUp ? 'Create account' : 'Sign in';
  document.getElementById('formSub').textContent = isSignUp ? 'Join The Mulligan.' : 'Your Commander deck advisor.';
  document.getElementById('submitText').textContent = isSignUp ? 'Create account' : 'Sign in';
  document.getElementById('switchText').innerHTML = isSignUp
    ? 'Already have an account? <a onclick="toggleMode()">Sign in</a>'
    : "Don't have an account? <a onclick=\"toggleMode()\">Sign up</a>";
  hideError();
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('errorMsg').style.display = 'none';
}

async function handleSubmit() {
  hideError();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { showError('Enter your email and password.'); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('submitText').innerHTML = '<span class="spinner"></span>';
  try {
    if (isSignUp) {
      await TM.signUp(email, password);
      showError('Check your email to confirm your account, then sign in.');
      isSignUp = false;
      toggleMode();
    } else {
      await TM.signIn(email, password);
      window.location.href = '/';
    }
  } catch (e) {
    showError(e.message || 'Something went wrong.');
  }
  btn.disabled = false;
  document.getElementById('submitText').textContent = isSignUp ? 'Create account' : 'Sign in';
}

async function handleGoogle() {
  try {
    const res = await TM.sbFetch('/auth/v1/authorize?provider=google', { method: 'GET' });
    if (res?.url) window.location.href = res.url;
  } catch (e) {
    showError('Google sign-in unavailable. Use email and password.');
  }
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSubmit();
});

if (TM.getSession()) window.location.href = '/';
</script>
</body>
</html>
